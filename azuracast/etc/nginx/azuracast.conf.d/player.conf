
   location ~* ^/static/uploads/test/album_art\.([0-9]+)\.(png|jpg)$ {
        alias /var/azuracast/storage/uploads;
        try_files /test/album_art.$2 /static/img/generic_song.jpg;
    }

   # The player is installed to /var/azuracast/player, NOT under nginx's root
   # (/var/azuracast/www/web). AzuraCast's dev compose bind-mounts host source over
   # /var/azuracast/www, which would shadow the player if it lived inside that tree.
   # Serving it via an alias keeps dev and prod identical.
   #
   # nginx workers run as `azuracast` and /var/azuracast is mode 700, so whatever
   # installs the player must chown it to azuracast:azuracast.
   location /static/player {
         alias /var/azuracast/player;
         index index.html;
    }

